<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;font-size:22px;fill:#1a1a1a;font-weight:600}
      .m{font-family:'DejaVu Sans Mono',Menlo,monospace;font-size:14px;fill:#555}
      .s{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#333}
      .k{font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:2px;fill:#888}
      .box{fill:#fff;stroke:#1a1a1a;stroke-width:1.5}
      .hl{fill:#fff;stroke:#c2410c;stroke-width:2.5}
      .ln{stroke:#1a1a1a;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dl{stroke:#999;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="560" fill="#faf9f6"/>
  <text x="60" y="62" class="k">CLEARSIGHT · TRACK 2 · DETERMINISTIC PIPELINE (PYTHON STDLIB, NO MODEL, NO NETWORK)</text>
  <text x="60" y="100" class="t" style="font-size:30px">One alert hit in, one cited decision out</text>

  <!-- main row -->
  <g>
    <rect x="60" y="200" width="200" height="120" class="box"/>
    <text x="80" y="238" class="t">Alert + hits</text>
    <text x="80" y="264" class="m">alerts.jsonl</text>
    <text x="80" y="286" class="m">hits.jsonl</text>

    <rect x="320" y="200" width="230" height="120" class="box"/>
    <text x="340" y="238" class="t">Resolve customer</text>
    <text x="340" y="264" class="m">resolve.py</text>
    <text x="340" y="290" class="s">links · joint holders</text>

    <rect x="610" y="200" width="230" height="120" class="box"/>
    <text x="630" y="238" class="t">Verified facts</text>
    <text x="630" y="264" class="m">profile.py</text>
    <text x="630" y="290" class="s">approved KYC beats declared</text>

    <rect x="900" y="200" width="230" height="120" class="box"/>
    <text x="920" y="238" class="t">Listed-person facts</text>
    <text x="920" y="264" class="m">hitfacts.py</text>
    <text x="920" y="290" class="s">DOBs, countries, reports</text>

    <rect x="1190" y="200" width="160" height="120" class="hl"/>
    <text x="1210" y="238" class="t">Decide</text>
    <text x="1210" y="264" class="m">decide.py</text>
    <text x="1210" y="290" class="s">POLICY.md §6–8</text>

    <path d="M260,260 L316,260" class="ln"/>
    <path d="M550,260 L606,260" class="ln"/>
    <path d="M840,260 L896,260" class="ln"/>
    <path d="M1130,260 L1186,260" class="ln"/>
    <path d="M1350,260 L1400,260 L1400,400 L1360,400" class="ln"/>
  </g>

  <!-- data sources -->
  <text x="320" y="150" class="m">customers · accounts</text>
  <path d="M435,158 L435,196" class="dl"/>
  <text x="610" y="150" class="m">approved KYC · notes</text>
  <path d="M725,158 L725,196" class="dl"/>
  <text x="900" y="150" class="m">notes · search results</text>
  <path d="M1015,158 L1015,196" class="dl"/>
  <text x="1190" y="150" class="m">name_variants.json</text>
  <path d="M1270,158 L1270,196" class="dl"/>

  <!-- output -->
  <rect x="320" y="370" width="1040" height="110" class="box"/>
  <text x="340" y="402" class="k">ONE JSON LINE PER HIT · output/dev.jsonl</text>
  <text x="340" y="432" class="m">{"hit_id":"H-…","decision":"DIFFERENT_ENTITY | SAME_ENTITY | REVIEW","reason_code":"…",</text>
  <text x="340" y="456" class="m"> "customer_record_id":"CUS-… | AMBIGUOUS","reason":"2–4 factual sentences","evidence":["KYC-…","NOTE-…","CUS-…"]}</text>
  <text x="60" y="530" class="s">Clear only on a contradiction · confirm only on agreement · otherwise REVIEW. Same input → byte-identical output.</text>
</svg>

name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_policy.py
      - run: python3 tests/test_ages.py
      - run: python3 tests/test_loader.py
      - run: python3 tests/test_runner_boundary.py
      - run: python3 tests/test_real_format.py
      - run: python3 tests/test_packaging.py
      - run: python -m py_compile system/*.py
